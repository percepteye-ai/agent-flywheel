[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "percepteye-harness"
version = "0.1.0"
description = "Run your own agent harness against Percepteye rollouts. Outbound-only, one dependency."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Percepteye" }]
keywords = ["agents", "reinforcement-learning", "rollout", "evaluation", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# ── ONE runtime dependency. This is a load-bearing constraint, not a boast. ──
# The SDK runs inside a customer's production process; every dependency we add
# is a version conflict we impose on them. `tests/test_oss_boundary.py` asserts
# this list stays at one entry.
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/percepteye/percepteye-harness"
Source = "https://github.com/percepteye/percepteye-harness"
Issues = "https://github.com/percepteye/percepteye-harness/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
percepteye-harness = "percepteye_harness.cli:main"

# Framework adapters are SEPARATE distributions with independent versions and
# their own compatibility matrices. That is the structural answer to a previous
# SDK in which three of six framework integrations were broken against the
# installed library and nothing noticed: when a framework breaks we ship
# percepteye-harness-langchain 2.1.1, not a new core.
[project.entry-points."percepteye_harness.adapters"]
# (populated by adapter distributions, never by core)

[tool.hatch.build.targets.wheel]
packages = ["src/percepteye_harness"]

[tool.hatch.build.targets.sdist]
include = ["src/", "schema/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
