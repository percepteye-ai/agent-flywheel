[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "percepteye-agent-flywheel"
version = "0.1.0"
description = "Run your own agent against Percepteye rollouts. Outbound-only, one dependency."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Percepteye" }]
keywords = ["agents", "reinforcement-learning", "rollout", "evaluation", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# ── ONE runtime dependency. This is a load-bearing constraint, not a boast. ──
# The SDK runs inside a customer's production process; every dependency we add
# is a version conflict we impose on them. `tests/test_oss_boundary.py` asserts
# this list stays at one entry.
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/percepteye/percepteye-agent-flywheel"
Source = "https://github.com/percepteye/percepteye-agent-flywheel"
Issues = "https://github.com/percepteye/percepteye-agent-flywheel/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.8"]
# Frameworks the built-in adapters bind to. NOT runtime dependencies -- no
# adapter imports its framework at module scope, so an absent framework just
# fails that adapter's probe. These exist so CI actually exercises the
# adapters against the real API rather than a mock of it.
adapters-test = ["langchain-core>=0.3", "google-adk>=2.2"]

# Third parties ship adapters through this group. Ours live in
# percepteye_agent_flywheel.adapters and need no entry point: an adapter imports its
# framework only at bind time, so shipping it here costs nothing and adds no
# dependency. Separate distributions would have bought a release cadence we do
# not need, in exchange for version skew between core and adapter -- the same
# class of silent breakage the probe design exists to remove.
[project.entry-points."percepteye_agent_flywheel.adapters"]

[tool.hatch.build.targets.wheel]
packages = ["src/percepteye_agent_flywheel"]

[tool.hatch.build.targets.sdist]
include = ["src/", "schema/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
