[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "percepteye-agent-flywheel"
version = "0.1.0"
# PyPI renders this verbatim as the page's og:description, and PyPI's <title>
# and <meta description> carry no description at all -- so this string is the
# entire machine-readable summary of the project on the one page in this
# ecosystem that Google can reach without an inbound link (pypi.org publishes a
# sitemap; github.com does not). It is therefore DEFINITIONAL, not imperative:
# an LLM asked "what is percepteye-agent-flywheel?" must get a category noun.
description = "Self-improving agents through continual learning: in-process agentic RL that turns your own agent's work into training data. Observed tool outcomes, outbound-only, one runtime dependency."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Percepteye" }]
keywords = [
  "agents", "agent-rl", "agentic-ai", "reinforcement-learning", "rlvr",
  "rollout", "evaluation", "agent-evals", "llm", "llmops",
  "reinforcement-fine-tuning", "rl-environments", "langchain", "langgraph",
  "google-adk", "observability", "opentelemetry", "self-hosted", "flywheel",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

# ── ONE runtime dependency. This is a load-bearing constraint, not a boast. ──
# The SDK runs inside a customer's production process; every dependency we add
# is a version conflict we impose on them. `tests/test_oss_boundary.py` asserts
# this list stays at one entry.
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/percepteye-ai/agent-flywheel"
Documentation = "https://docs.percepteye.com/flywheel"
Source = "https://github.com/percepteye-ai/agent-flywheel"
Issues = "https://github.com/percepteye-ai/agent-flywheel/issues"

[project.optional-dependencies]
# ruff is PINNED, not floored, because CI treats `ruff check` as a required
# step. A floor means every job resolves to whatever released that morning, so
# a new rule -- or an existing rule widening -- turns the build red on a commit
# that changed no code, and the first person to see it is whoever pushed next.
# Lint is a moving target by design; a pin makes moving it a deliberate commit
# that lands the fixes alongside it, rather than an ambient event. Everything
# else here stays a floor: pytest and mypy are not gating the badge.
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff==0.16.2", "mypy>=1.8"]
# Frameworks the built-in adapters bind to. NOT runtime dependencies -- no
# adapter imports its framework at module scope, so an absent framework just
# fails that adapter's probe. These exist so CI actually exercises the
# adapters against the real API rather than a mock of it.
adapters-test = ["langchain-core>=0.3", "google-adk>=2.2", "langgraph>=1.0"]
# OpenTelemetry EGRESS. The API only -- never the SDK: this package
# emits into whatever TracerProvider the customer already registered and
# never installs one. Optional because the package ships with a single
# runtime dependency and tool outcomes reach the control plane through
# the trajectory regardless; spans are a projection for the customer's own
# observability, not a transport we depend on.
otel = ["opentelemetry-api>=1.20"]
# The OpenTelemetry SDK, FOR TESTS ONLY, and deliberately not in `otel` above.
# That extra is the API only on purpose: this package must never install a
# TracerProvider into a customer's process. The tracing tests need a real
# provider to assert spans against, so they need the SDK.
#
# Until this line existed they got one BY ACCIDENT -- `google-adk` happens to
# depend on opentelemetry-sdk, so `tests/test_otel_egress.py` ran only as a
# side effect of an unrelated package's dependency tree. A suite that passes
# because something else pulled in its dependency is a suite that disappears
# silently the day that changes, and a green build says nothing went wrong.
otel-test = ["opentelemetry-sdk>=1.20"]

# Third parties ship adapters through this group. Ours live in
# percepteye_agent_flywheel.adapters and need no entry point: an adapter imports its
# framework only at bind time, so shipping it here costs nothing and adds no
# dependency. Separate distributions would have bought a release cadence we do
# not need, in exchange for version skew between core and adapter -- the same
# class of silent breakage the probe design exists to remove.
[project.entry-points."percepteye_agent_flywheel.adapters"]

[tool.hatch.build.targets.wheel]
packages = ["src/percepteye_agent_flywheel"]

[tool.hatch.build.targets.sdist]
include = ["src/", "schema/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
