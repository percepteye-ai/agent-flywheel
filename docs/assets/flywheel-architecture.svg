<text x="258" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e">your agent gets better from its own conversations</text>
<text x="1148" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="end">0 lines changed inside your agent</text>
<line x1="600" y1="112" x2="600" y2="826" stroke="#30363d" stroke-width="1.4" stroke-dasharray="5 9"/>
