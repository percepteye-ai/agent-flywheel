<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The agent flywheel as a closed ring: your agent runs a rollout, PerceptEye scores the observed outcomes and trains a policy, your production agent picks it up, and its live evidence feeds the next lap. A dashed trust boundary runs down the middle; the two stations on the left are processes you run, the two on the right are the control plane. Four numbered lanes cross the boundary.">
