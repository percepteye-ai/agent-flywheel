<text x="52" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#58a6ff" letter-spacing="1.2">YOUR INFRASTRUCTURE</text>
<text x="52" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6e7681">your process · your credentials · your firewall</text>
