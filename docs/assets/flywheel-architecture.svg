<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="The improvement loop as a ring. Once: you connect your agent, with our SDK, the OpenTelemetry traces it already exports, or your observability provider, and allow us to learn from its conversations. Then every round: its real conversations are sent from your side; we learn from them; each new version is tested against your agent&apos;s current best on conversations it has never seen; a version that does better comes to you in Decisions; and your agent runs the version you approved, and the next round starts from it. A dashed trust boundary runs down the middle; every connection is opened from your side.">
<defs>
<marker id="a58a6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
