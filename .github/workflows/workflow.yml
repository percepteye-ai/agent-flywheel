name: release

# Publishes to PyPI via TRUSTED PUBLISHING (OIDC). There is no API token in
# this repository, in an environment variable, or in a secret -- GitHub mints
# a short-lived identity token for this workflow and PyPI verifies it against
# the publisher you configured there. Nothing long-lived exists to leak.
#
# One-time setup on PyPI, done on 2026-09-14 by a human with the account. It
# stays written down because redoing it (a new project, a renamed file) is the
# same flow:
#
#   1. https://pypi.org/manage/account/publishing/ -- a "pending publisher",
#      the flow for a project that does not exist on PyPI yet. The first
#      upload, 0.1.0, turned it into the project's ordinary publisher.
#   2. PyPI Project Name : agent-flywheel
#      Owner            : percepteye-ai
#      Repository name  : agent-flywheel
#      Workflow name    : workflow.yml
#      Environment name : pypi
#   3. A GitHub environment named `pypi` (Settings -> Environments), with a
#      required reviewer: each publish waits for a human to approve it
#      (docs/RELEASING.md, section 4d).
#
# After that, publishing is: push a tag, then approve the `pypi` job. The
# tag publishes only after the WHOLE CI suite (ci.yml, called below) and the
# build pass on that commit, and only if the tag matches pyproject's version
# -- for a manual (workflow_dispatch) publish to PyPI too, which must
# therefore be run on the tag, never on a branch.
#
# THIS FILE'S NAME IS PART OF THAT CONFIGURATION. PyPI matches the publisher on
# the workflow FILE name, not on `name:` above, and a token minted by any other
# file is refused with `invalid-publisher` before anything uploads. That is how
# the first v0.1.0 run failed, as release.yml, against a publisher registered
# for workflow.yml. Rename this file only together with the publisher on PyPI.
#
# NOTE, because it is irreversible: PyPI never allows a filename to be reused,
# even after deletion. A version published by mistake is spent forever. The
# testpypi job below exists so the first run of this workflow is not also the
# first time anyone has seen it work.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

# Read-only by default; only the publish jobs get the OIDC token, below.
permissions:
  contents: read

jobs:
  ci:
    # The full CI suite -- tests on every supported Python and OS, every
    # optional framework, lint, the clean install, the OSS boundary and the
    # cross-language ABI check -- on THIS commit. Nothing below runs unless
    # it passes. Called, not copied: ci.yml is the one definition.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: the tag must match the version in pyproject
        # A tag that disagrees with the packaged version produces a release
        # nobody can find by the name they were given. Asked of EVERY run that
        # can publish to PyPI: a tag push, and a manual dispatch with
        # target=pypi -- which used to skip it, so any branch could publish an
        # untagged build, irreversibly. A dispatch to PyPI must be run on the
        # tag (the "Use workflow from" picker), or this fails.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        run: |
          python - <<'PY'
          import os, tomllib
          ref = os.environ["GITHUB_REF"]
          assert ref.startswith("refs/tags/v"), (
              f"a PyPI publish must run on a v* tag; this run is on {ref}")
          tag = ref.removeprefix("refs/tags/v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == ver, f"tag v{tag} != pyproject version {ver}"
          print(f"tag and version agree: {ver}")
          PY

      - run: pip install build twine
      - run: python -m build

      - name: metadata is valid and the README renders on PyPI
        # PyPI rejects a long_description it cannot render, and it rejects it
        # AFTER accepting the filename -- which is then spent.
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  testpypi:
    # A full dress rehearsal. TestPyPI is a separate index with separate
    # filename accounting, so a mistake here costs nothing on the real one.
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # the OIDC token. No secrets needed, or present.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi        # required reviewer: a human approves each publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
