name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The BARE install: no frameworks, no OpenTelemetry. This job proves the
    # package works for someone who installed nothing but httpx, which is the
    # supported configuration. The adapter, introspection and OTel suites
    # correctly skip here -- `test-full` below is what actually runs them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src tests

  test-full:
    # EVERY test, with every optional framework present.
    #
    # This job exists because the matrix above installs only `[dev]`, and five
    # test modules guard themselves with a module-level `pytest.importorskip`.
    # They were therefore never collected at all -- 72 tests, silently absent
    # from a green build. Among them is tests/test_zero_instrumentation.py,
    # which is the proof of the headline claim in the README: that a LangChain
    # or ADK agent needs zero lines changed. The claim was documented and
    # untested at the same time.
    #
    # A skipped test and a passing test are indistinguishable in a green check
    # mark, so this job refuses to skip anything at all.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]   # the ends of the supported range
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # THE CROSS-SDK PARITY TEST NEEDS THE NODE SDK, and "everything present"
      # is this job's whole premise -- so the SDK is part of everything.
      # Without this checkout tests/test_report_turns_wire.py skips, and the
      # zero-skip step below then fails the build on every push: red for a
      # reason unrelated to the change, while the parity it exists to prove
      # goes unchecked. Node is installed here for the same reason: that test
      # runs the Node SDK's own transport.
      - uses: actions/checkout@v4
        with:
          repository: percepteye-ai/agent-flywheel-node
          path: agent-flywheel-node
          token: ${{ secrets.NODE_SDK_READ_TOKEN }}
      - run: pip install -e ".[dev,adapters-test,otel,otel-test]"
      # THE PRIME EXAMPLE'S TESTS EXECUTE THE REAL BINARY, for the same reason
      # the Node SDK is checked out above: "everything present" is this job's
      # premise, and tests/test_prime_binary_execution.py is the only thing in
      # the suite that proves the example's launch command, its run-owned
      # daemon and its attested provider ceiling actually PRODUCE a completion.
      # Everything else about that example mocks fw.serve and inspects the
      # argv, which is exactly what stayed green through a week of rollouts
      # that claimed work and returned nothing.
      #
      # Without this install those two tests skip, and the zero-skip step below
      # then fails the build on every push -- red for a reason unrelated to the
      # change, while the proof it exists for goes unrun.
      #
      # PINNED, and this line is the repo's ONLY declaration of which version:
      # the installed `dist/` tree is hashed into agent_execution_sha256, which
      # is the identity a sealed OPSD rollout is claimed under, so a floating
      # install would execute a binary production does not run and would turn
      # main red on somebody else's release.
      #
      # WHAT IS CHECKED AND WHAT IS NOT. Nothing in this repo can read the
      # deployed version, so this pin is maintained by hand and must be bumped
      # with the deployment -- saying more than that in a comment would be a
      # claim nobody verifies. What IS verified is that the harness actually on
      # PATH reports this version: tests/test_prime_binary_execution.py reads
      # the pin back out of this line and asserts `--version` against it, so an
      # install that resolved to something else fails the suite rather than
      # silently changing the attested identity.
      - run: npm install -g prime-agent@0.7.2
      # Those tests roll out against a REAL kernel venv, because the example
      # refuses one Prime would refuse to run, and the installed prime-agent
      # builds it with its own bootstrap, which needs `uv`. Without uv the
      # fixture cannot provision one, and the named package root below turns
      # that into a failure, not a skip.
      - run: pip install uv
      - name: every optional framework is genuinely importable
        # Checked BEFORE pytest, so a framework that failed to install is a
        # legible error here rather than 72 tests quietly turning into skips.
        run: |
          python - <<'PY'
          import importlib
          for mod in ("langchain_core", "langgraph", "langgraph.prebuilt",
                      "google.adk", "opentelemetry.trace", "opentelemetry.sdk",
                      "packaging"):
              importlib.import_module(mod)
              print("ok", mod)
          PY
      - name: name the prime-agent package root, so a bad install FAILS
        # NAMED for the same reason PERCEPTEYE_NODE_SDK is: auto-discovery may
        # skip, an explicit path is a promise. With this set, an `npm install`
        # that succeeded but put nothing usable there is a test failure here
        # rather than two tests quietly turning back into skips. `npm root -g`
        # is asked rather than assumed -- the global prefix differs between
        # runners and between setup-node versions.
        run: echo "PRIME_AGENT_PACKAGE_ROOT=$(npm root -g)/prime-agent" >> "$GITHUB_ENV"
      - run: pytest -q --junitxml=report.xml
        env:
          # NAMED, not guessed. scripts/cross_language_abi_check.sh is the one
          # resolver both the script and the parity test ask, and a path it
          # was GIVEN that is not there is a hard error there -- so moving
          # this checkout turns the parity test red rather than silently
          # skipping it.
          PERCEPTEYE_NODE_SDK: ${{ github.workspace }}/agent-flywheel-node
      - name: nothing was skipped -- a skipped suite is an untested claim
        # Deliberately not a hardcoded test count: that has to be bumped with
        # every new test and gets rubber-stamped. "Zero skips" is the invariant
        # that actually holds, and it catches a suite vanishing whether it went
        # by importorskip, by a platform guard, or by a dependency drifting out
        # from under it.
        if: always()
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists("report.xml"):
              # pytest died before it could write one; it has already failed
              # the job and its own output is the useful error. Do not bury
              # that under a traceback from this check.
              print("no report.xml — see the pytest step above")
              raise SystemExit(0)
          root = ET.parse("report.xml").getroot()
          s = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"{tests} collected, {skipped} skipped")
          if skipped:
              names = [f"{c.get('classname')}.{c.get('name')}"
                       for c in s.iter("testcase") if c.find("skipped") is not None]
              print("skipped:", *names, sep="\n  ", file=sys.stderr)
              sys.exit(f"{skipped} test(s) skipped with all extras installed")
          PY

  clean-install:
    # The package runs inside other people's production processes. This job
    # proves a fresh environment needs nothing but httpx -- if a module ever
    # reaches for an undeclared import, it fails here rather than in a
    # customer's deployment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: installed dependency tree is httpx and its own deps only
        run: |
          python - <<'PY'
          import importlib.metadata as md
          direct = md.distribution("agent-flywheel").requires or []
          assert [r for r in direct if "extra" not in r] == ["httpx>=0.27"], direct
          PY
      - name: import without the dev extra present
        run: python -c "import agent_flywheel; print(agent_flywheel.__version__)"

  boundary:
    # Fails the build if an internal system name reaches the published package
    # -- including inside an error string, where it would be printed into a
    # customer's logs and disclose something they cannot act on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_oss_boundary.py -q

  node-plugins:
    # The OpenClaw and DeepSeek Harness plugins are the same capture contract
    # in another language, so they are tested against the SAME reader the
    # Python side uses. A JS suite that only checks itself would let the halves
    # drift: a plugin would stay green while writing a line `Trajectory.read`
    # counts as malformed, and the loss would surface as a silently short
    # tool-call list.
    #
    # THE PLUGINS' OWN SUITE MOVED WITH THEM. They live in
    # percepteye-ai/agent-flywheel-node now and that repo runs `npm test`. What
    # stays here is the half that can only be checked HERE: the reader is in
    # this repo, and this is the job that proves what the plugins write is what
    # it reads. Keeping a copy of their unit tests here too would be a second
    # place to update and the one more likely to be forgotten.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]   # the ends of OpenClaw's supported engine range
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Node SDK is its own repo now (percepteye-ai/agent-flywheel-node).
      # Checked out INSIDE the workspace and NAMED to the script through
      # PERCEPTEYE_NODE_SDK below; a developer with it cloned beside this repo
      # gets the same answer from the script's auto-discovery. One resolver,
      # two ways in.
      #
      # It is a private repo, so this needs a token with read access to it.
      # Without one the checkout fails loudly here rather than the ABI check
      # silently skipping, which is the right order: a missing credential is a
      # CI defect, not a reason to stop checking the contract. And if the path
      # it lands at ever changes, the ABI check fails too -- a NAMED path that
      # is not there is an error there, not a skip.
      - uses: actions/checkout@v4
        with:
          repository: percepteye-ai/agent-flywheel-node
          path: agent-flywheel-node
          token: ${{ secrets.NODE_SDK_READ_TOKEN }}
      - name: what the plugins write is what the Python SDK reads
        # One definition, invoked from here and runnable by hand. It used to be
        # inline, and a local approximation of it passed while the real one
        # failed -- the JS half had grown two records and the assertion had not.
        run: |
          pip install -e .
          PERCEPTEYE_NODE_SDK="$GITHUB_WORKSPACE/agent-flywheel-node" \
            ./scripts/cross_language_abi_check.sh
